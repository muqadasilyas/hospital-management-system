<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Hospital Management System{% endblock %}</title>
</head>

<body>

    <header align = "center">
        <h1 align="center">Hospital Management System</h1>
         {% if user.is_authenticated %}
            <p align="center">Welcome, {{ user.username }}</p>
            <button>
                 <a href="{% url 'logout' %}">Logout</a>
            </button><br><br>


         {% endif %}
        <nav>
            <a href="{% url 'patient' %}">
                Patients &emsp;
            </a>

            <a href="{% url 'doctor_list' %}">
                Doctor  &emsp;
            </a>
            <a href="{% url 'department_list' %}">
                Department  &emsp;
            </a>
            <a href="{% url 'appointment_list' %}">
                Appointments
            </a>
        </nav>
    </header>

    <hr>

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <hr>

    <footer>
        <p>Hospital Management System</p>
    </footer>

</body>

</html>
