{% extends "base.html" %}

{% block title %}
Delete Department
{% endblock %}

{% block content %}
<h1>Delete Department</h1>

<p>
    Are you sure you want to delete
    {{ department.department_name }} ?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>
<br>
<a href="{% url 'department_list' %}">
    Cancel
</a>
{% endblock %}
