<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete</title>
</head>
<body>
<h1>Delete Patient</h1>

<p>
    Are you sure you want to delete
    {{ patient.first_name }} {{ patient.last_name }}?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>
<br>
<a href="{% url 'patient_detail' patient.id %}">
    Cancel
</a>
</body>
</html>
