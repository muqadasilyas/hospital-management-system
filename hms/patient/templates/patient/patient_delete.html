{% extends "base.html" %}
{% block title %}
Delete Patient
{% endblock %}

{% block content %}
<h1>Delete Patient</h1>

<p>
    Are you sure you want to delete
    {{ patient.first_name }} {{ patient.last_name }}?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>
<br>
<a href="{% url 'patient_detail' patient.id %}">
    Cancel
</a>

{% endblock %}
