{% extends "base.html" %}

{% block title %}
Delete Appointment
{% endblock %}

{% block content %}
<h1>Delete Appointment</h1>

<p>
    Are you sure you want to delete appointment for patient
    {{ appointment.patient}} ?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>
<br>
<a href="{% url 'appointment_list' %}">
    Cancel
</a>
{% endblock %}
