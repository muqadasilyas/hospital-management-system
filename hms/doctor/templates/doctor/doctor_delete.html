{% extends "base.html" %}

{% block title %}
Delete Doctor
{% endblock %}

{% block content %}
<h1>Delete Doctor</h1>

<p>
    Are you sure you want to delete
    {{ doctor.first_name }} {{ doctor.last_name }}?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>
<br>
<a href="{% url 'doctor_list' doctor.id %}">
    Cancel
</a>
{% endblock %}
